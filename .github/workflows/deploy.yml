name: Deploy

# Runs after CI passes on main (or by hand from the Actions tab).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued one waits rather than cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sajadk/invoiceflow-api
  AWS_REGION: ap-south-1

jobs:
    image:
    name: Build and push API image
    # Only after CI passed on a push to this repo's main (never a PR, never a fork),
    # or when started by hand (which requires write access).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile.prod
          platforms: linux/amd64 # t3 instances are x86
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api:
    name: Deploy API to EC2
    needs: image
    # Skipped until the AWS side is set up (see docs/deployment.md).
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: short-lived AWS credentials, no access keys stored in GitHub
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Systems Manager runs update.sh on the instance: no SSH port or key needed.
      - name: Run update.sh on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${{ needs.image.outputs.sha }}" \
            --parameters 'commands=["/opt/invoiceflow/update.sh"]' \
            --query Command.CommandId --output text)

          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = "Success"

  web:
    name: Deploy web app to S3 + CloudFront
    needs: api # API first: new screens may need new endpoints
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        env:
          BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          # Hashed bundles never change: cache for a year.
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          # index.html and friends: always revalidate, so a deploy shows up immediately.
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" --query Invalidation.Id --output text

      - name: Smoke test through CloudFront
        env:
          DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
        run: |
          curl -fsS "https://$DOMAIN/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "https://$DOMAIN/invoices"   # SPA route → index.html
