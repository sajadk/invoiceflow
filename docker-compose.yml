name: invoiceflow

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: invoiceflow
      MYSQL_USER: invoiceflow
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 3307 on your Mac so it never clashes with MAMP or a local MySQL on 3306
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./docker/api
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      # keep Linux node_modules inside Docker, separate from your Mac's
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysql-data:
  web-node-modules:
